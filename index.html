<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Mi cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <section class="auth-card mx-auto bg-white border rounded-4 shadow-sm p-4 p-md-5">
      <p class="text-primary fw-bold mb-1">ACTIVIDAD 9</p>
      <h1 class="h3 fw-bold">Acceso de usuarios</h1>
      <p class="text-secondary mb-4">Registrate o iniciá sesión para acceder a tu cuenta.</p>

      <div id="mensaje" class="d-none" role="alert"></div>

      <ul class="nav nav-pills nav-fill mb-4" id="tabs">
        <li class="nav-item"><button class="nav-link active" data-form="login" type="button">Iniciar sesión</button></li>
        <li class="nav-item"><button class="nav-link" data-form="registro" type="button">Crear cuenta</button></li>
      </ul>

      <form id="loginForm">
        <div class="mb-3"><label class="form-label" for="loginEmail">Correo electrónico</label><input id="loginEmail" class="form-control" type="email" required></div>
        <div class="mb-3"><label class="form-label" for="loginPassword">Contraseña</label><input id="loginPassword" class="form-control" type="password" minlength="6" required></div>
        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
      </form>

      <form id="registroForm" class="d-none">
        <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" type="text" required></div>
        <div class="mb-3"><label class="form-label" for="registroEmail">Correo electrónico</label><input id="registroEmail" class="form-control" type="email" required></div>
        <div class="mb-3"><label class="form-label" for="registroPassword">Contraseña</label><input id="registroPassword" class="form-control" type="password" minlength="6" required><div class="form-text">Mínimo 6 caracteres.</div></div>
        <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
